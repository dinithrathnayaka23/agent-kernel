# Agent Kernel local development configuration.
session:
  type: in_memory
  cache:
    size: 256

logging:
  ak:
    level: INFO

# TODO (Phase 3c, memory): add a `knowledgebase:` block once save_user_profile/
# load_user_profile are backed by a real KnowledgeBase (e.g. chroma).

# `agent` is left unset (defaults to "") so Slack messages route to the first agent
# registered in agent.py — profile_agent — same entry point as the web frontend.
# SLACK_BOT_TOKEN and SLACK_SIGNING_SECRET are read directly by slack_bolt from the
# environment, not from this file — see README.md for where to get them.
slack:
  agent_acknowledgement: "Let me look into that for you"
